name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare LaMa inpainting model (download + int8 quantize + verify)
        run: |
          pip install --quiet onnxruntime onnx
          python scripts/prepare_model.py

      - name: Build APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Sign APK
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          echo "Using build-tools: $BT"
          keytool -genkeypair -v -keystore release.keystore -alias mediaforge \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass mediaforge2024 -keypass mediaforge2024 \
            -dname "CN=MediaForge, OU=Logan, O=Logan, C=CN"
          ${BT}/zipalign -f 4 app/build/outputs/apk/release/app-release-unsigned.apk app-release-aligned.apk
          ${BT}/apksigner sign --ks release.keystore --ks-pass pass:mediaforge2024 \
            --key-pass pass:mediaforge2024 --out MediaForge-v1.4.0.apk app-release-aligned.apk
          ${BT}/apksigner verify MediaForge-v1.4.0.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MediaForge-APK
          path: MediaForge-v1.4.0.apk

      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view v1.4.0 || gh release create v1.4.0 --title "MediaForge v1.4.0" --notes "v1.4.0 大版本更新（用户建议）：① 识别增强：视频/音频/图片全面解析并显示——宽高比（如 16:9、9:16）、帧率、总码率、视频流码率、音频流码率（有声视频的视频/音频参数分开显示，各自是各自的）、视频/音频位深、像素格式、色彩空间（BT.709/601/2020）、色彩范围；图片显示位深、色彩模式（RGB/RGBA/灰度/索引/CMYK）、内嵌 ICC 色彩空间名（如 sRGB、Display P3），识别页与转换页都显示；② 视频转换新增「画面比例」设置（16:9/9:16/1:1/4:3/3:4/3:2/2:3/21:9）：裁剪填满或黑边适配，输出文件宽高比严格等于所选比例（真实生效）；新增「色彩空间/色彩范围」调整（BT.709/BT.601/BT.2020、TV/PC 范围），FFmpeg 真实转换并写入元数据，可用识别页验证；③ 图片转换新增比例裁剪：预设比例自动居中裁剪 + 自由裁剪（拖动裁剪框：框内移动、四角缩放、空白处画新框），预览所见即所得，输出真实裁剪；④ 重做视频预览：竖屏视频控制按钮不再被遮挡——控制条固定在画面下方任何比例都完整可见，画面按真实宽高比等比显示不变形，播放结束按钮自动复位；⑤ 修复旧版按分辨率档位转码时非 16:9 源被拉伸变形的问题（改为等比适配）。作者：罗根"
          gh release upload v1.4.0 MediaForge-v1.4.0.apk --clobber
