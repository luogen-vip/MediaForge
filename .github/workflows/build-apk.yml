name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare LaMa inpainting model (download + int8 quantize + verify)
        run: |
          pip install --quiet onnxruntime onnx
          python scripts/prepare_model.py

      - name: Build APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Sign APK
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          echo "Using build-tools: $BT"
          keytool -genkeypair -v -keystore release.keystore -alias mediaforge \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass mediaforge2024 -keypass mediaforge2024 \
            -dname "CN=MediaForge, OU=Logan, O=Logan, C=CN"
          ${BT}/zipalign -f 4 app/build/outputs/apk/release/app-release-unsigned.apk app-release-aligned.apk
          ${BT}/apksigner sign --ks release.keystore --ks-pass pass:mediaforge2024 \
            --key-pass pass:mediaforge2024 --out MediaForge-v1.3.2.apk app-release-aligned.apk
          ${BT}/apksigner verify MediaForge-v1.3.2.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MediaForge-APK
          path: MediaForge-v1.3.2.apk

      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view v1.3.2 || gh release create v1.3.2 --title "MediaForge v1.3.2" --notes "v1.3.2 稳定性重点修复（用户反馈）：① 修复图片去水印必失败的异常 Immutable bitmap passed to Canvas constructor——框选与涂抹两种方式现在都能正常出结果；② 修复任务页「裁剪」显示旧总时长的问题：任务现在记录转换结果的真实时长，裁剪过再裁剪显示的就是裁剪后的时长；③ 修复再裁剪后无法播放的问题：裁剪区间自动按文件实际时长钳制，杜绝裁出空/坏文件，播放失败时也会明确提示而不是无反应；④ 试听/裁剪编辑器以文件实际时长为准，兼容旧版本任务记录。作者：罗根"
          gh release upload v1.3.2 MediaForge-v1.3.2.apk --clobber
