name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 模型已直接提交在 assets/（开箱即用）；此步骤仅在缺失时下载+量化兜底。
      # onnxruntime 必须与 APP 打包的 onnxruntime-android 1.19.2 同版本，
      # 否则量化产物手机端可能不兼容（v1.4.4 教训）
      - name: Prepare LaMa inpainting model (skip if bundled)
        run: |
          pip install --quiet "onnxruntime==1.19.2" onnx numpy
          python scripts/prepare_model.py

      - name: Build APK
        run: gradle assembleRelease --no-daemon --stacktrace

      # 版本号直接读 build.gradle.kts 的 versionName，不再硬编码，杜绝改名忘改工作流
      - name: Sign APK
        run: |
          VER=$(grep -o 'versionName = "[^"]*"' app/build.gradle.kts | sed 's/.*"\(.*\)"/\1/')
          echo "Building version: $VER"
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          echo "Using build-tools: $BT"
          keytool -genkeypair -v -keystore release.keystore -alias mediaforge \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass mediaforge2024 -keypass mediaforge2024 \
            -dname "CN=MediaForge, OU=Logan, O=Logan, C=CN"
          ${BT}/zipalign -f 4 app/build/outputs/apk/release/app-release-unsigned.apk app-release-aligned.apk
          ${BT}/apksigner sign --ks release.keystore --ks-pass pass:mediaforge2024 \
            --key-pass pass:mediaforge2024 --out MediaForge-v${VER}.apk app-release-aligned.apk
          ${BT}/apksigner verify MediaForge-v${VER}.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MediaForge-APK
          path: MediaForge-v*.apk

      # 只有 tag 推送才发布 Release；普通 main 提交只出构建产物，不会覆盖任何已发布版本
      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release view "$TAG" || gh release create "$TAG" --title "MediaForge $TAG" --notes-file RELEASE_NOTES.md
          gh release upload "$TAG" MediaForge-v*.apk --clobber
