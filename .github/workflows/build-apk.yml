name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Sign APK
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          echo "Using build-tools: $BT"
          keytool -genkeypair -v -keystore release.keystore -alias mediaforge \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass mediaforge2024 -keypass mediaforge2024 \
            -dname "CN=MediaForge, OU=Logan, O=Logan, C=CN"
          ${BT}/zipalign -f 4 app/build/outputs/apk/release/app-release-unsigned.apk app-release-aligned.apk
          ${BT}/apksigner sign --ks release.keystore --ks-pass pass:mediaforge2024 \
            --key-pass pass:mediaforge2024 --out MediaForge-v1.2.2.apk app-release-aligned.apk
          ${BT}/apksigner verify MediaForge-v1.2.2.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MediaForge-APK
          path: MediaForge-v1.2.2.apk

      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view v1.2.2 || gh release create v1.2.2 --title "MediaForge v1.2.2" --notes "v1.2.2 稳定性重点修复（用户反馈）：① 修复图片分辨率页花屏闪退——此前输入/删除分辨率时预览区比例会瞬间变成极端值，撑爆渲染层导致整屏竖条花屏并闪退；现预览改为固定高度容器内等比缩放居中，任何输入都不会撑爆布局。② 修复分辨率输入框位置乱跳——预览区高度不再随输入变化，输入框固定在原位，删完字也不用重新找输入框。③ 新增分辨率上限校验（单边最大32767像素、总像素8000万），超限给出明确提示，转换引擎增加内存不足保护，避免崩溃。作者：罗根"
          gh release upload v1.2.2 MediaForge-v1.2.2.apk --clobber
