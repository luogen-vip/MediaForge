name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare LaMa inpainting model (download + int8 quantize + verify)
        run: |
          pip install --quiet onnxruntime onnx
          python scripts/prepare_model.py

      - name: Build APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Sign APK
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          echo "Using build-tools: $BT"
          keytool -genkeypair -v -keystore release.keystore -alias mediaforge \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass mediaforge2024 -keypass mediaforge2024 \
            -dname "CN=MediaForge, OU=Logan, O=Logan, C=CN"
          ${BT}/zipalign -f 4 app/build/outputs/apk/release/app-release-unsigned.apk app-release-aligned.apk
          ${BT}/apksigner sign --ks release.keystore --ks-pass pass:mediaforge2024 \
            --key-pass pass:mediaforge2024 --out MediaForge-v1.4.1.apk app-release-aligned.apk
          ${BT}/apksigner verify MediaForge-v1.4.1.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MediaForge-APK
          path: MediaForge-v1.4.1.apk

      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view v1.4.1 || gh release create v1.4.1 --title "MediaForge v1.4.1" --notes "v1.4.1 更新（用户反馈）：① 修复视频进度条拖动回跳——拖动时不再被播放进度打断，松手后从所选位置继续播放（转换页上传预览与音频播放同样生效）；② 自由裁剪全新交互：点击「自由裁剪」立即弹出全屏编辑器，单指拖动平移图片、双指捏合缩放，框内显示的就是最终裁剪画面（所见即所得），也可选 1:1/4:3/3:4/16:9/9:16 固定比例或拖四角自由调框，输出真实裁剪；③ 图片比例卡片新增迷你实时预览：选比例或手动输入宽高时不用上滑就能看到输出画面；④ 切到其他 APP 再回来直接恢复刚才的页面（记住页签，不再回到首页重新加载）；⑤ 新增色域显示：视频按 color_primaries 识别 Rec.709/sRGB、Rec.2020 广色域、DCI-P3 等，图片按内嵌 ICC 判断 sRGB/Adobe RGB/Display P3，识别页与转换页都显示；⑥ 参数防伪加强：新增双引擎交叉校验（FFprobe 与系统解码器独立解析），分辨率/时长不一致时明确提示元数据可能被篡改，并列出两边的真实值；⑦ 保留 v1.4.0 全部能力：识别增强（宽高比/帧率/视频音频流码率分开/位深/色彩空间）、视频画面比例与色彩空间真实转换、竖屏视频预览控件不遮挡。作者：罗根"
          gh release upload v1.4.1 MediaForge-v1.4.1.apk --clobber
