name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Sign APK
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          echo "Using build-tools: $BT"
          keytool -genkeypair -v -keystore release.keystore -alias mediaforge \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass mediaforge2024 -keypass mediaforge2024 \
            -dname "CN=MediaForge, OU=Logan, O=Logan, C=CN"
          ${BT}/zipalign -f 4 app/build/outputs/apk/release/app-release-unsigned.apk app-release-aligned.apk
          ${BT}/apksigner sign --ks release.keystore --ks-pass pass:mediaforge2024 \
            --key-pass pass:mediaforge2024 --out MediaForge-v1.2.1.apk app-release-aligned.apk
          ${BT}/apksigner verify MediaForge-v1.2.1.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MediaForge-APK
          path: MediaForge-v1.2.1.apk

      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view v1.2.1 || gh release create v1.2.1 --title "MediaForge v1.2.1" --notes "v1.2.1 任务体验优化（用户反馈修复）：① 任务列表改为最新任务排在最顶部，越新转换的越靠上；② 每个任务卡片显示创建时间（精确到秒，如 2026-11-04 15:30:21），多个任务一眼分清；③ 删除任务弹窗的「同时删除本地文件」勾选项改为始终显示（此前仅在已下载过副本时才出现），勾选后连同本地文件（含已下载到系统文件夹的副本）一起删除。作者：罗根" 
          gh release upload v1.2.1 MediaForge-v1.2.1.apk --clobber
