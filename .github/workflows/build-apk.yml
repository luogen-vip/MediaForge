name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Sign APK
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          echo "Using build-tools: $BT"
          keytool -genkeypair -v -keystore release.keystore -alias mediaforge \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass mediaforge2024 -keypass mediaforge2024 \
            -dname "CN=MediaForge, OU=Logan, O=Logan, C=CN"
          ${BT}/zipalign -f 4 app/build/outputs/apk/release/app-release-unsigned.apk app-release-aligned.apk
          ${BT}/apksigner sign --ks release.keystore --ks-pass pass:mediaforge2024 \
            --key-pass pass:mediaforge2024 --out MediaForge-v1.2.0.apk app-release-aligned.apk
          ${BT}/apksigner verify MediaForge-v1.2.0.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MediaForge-APK
          path: MediaForge-v1.2.0.apk

      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view v1.2.0 || gh release create v1.2.0 --title "MediaForge v1.2.0" --notes "v1.2.0 全新可视化裁剪：新增时间轴高亮条与播放头，保留区间一目了然；新增「试听选中区间」按钮，从起点播放到终点自动停止，听到的就是裁剪后保留的部分；播放中拖动滑块，声音立刻跳到你拖到的位置（拖到哪听到哪）；转换前裁剪（视频转音频/音频转音频均可用）与任务页转换结果裁剪均已支持；手动输入时间与滑块双向同步。作者：罗根" 
          gh release upload v1.2.0 MediaForge-v1.2.0.apk --clobber
