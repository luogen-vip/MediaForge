name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare LaMa inpainting model (download + int8 quantize + verify)
        run: |
          pip install --quiet onnxruntime onnx
          python scripts/prepare_model.py

      - name: Build APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Sign APK
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          echo "Using build-tools: $BT"
          keytool -genkeypair -v -keystore release.keystore -alias mediaforge \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass mediaforge2024 -keypass mediaforge2024 \
            -dname "CN=MediaForge, OU=Logan, O=Logan, C=CN"
          ${BT}/zipalign -f 4 app/build/outputs/apk/release/app-release-unsigned.apk app-release-aligned.apk
          ${BT}/apksigner sign --ks release.keystore --ks-pass pass:mediaforge2024 \
            --key-pass pass:mediaforge2024 --out MediaForge-v1.3.3.apk app-release-aligned.apk
          ${BT}/apksigner verify MediaForge-v1.3.3.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MediaForge-APK
          path: MediaForge-v1.3.3.apk

      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view v1.3.3 || gh release create v1.3.3 --title "MediaForge v1.3.3" --notes "v1.3.3 体验修复（用户反馈）：① 修复音频播放完毕后按钮不复位的问题——播放结束自动变回播放（三角）状态、进度停在结尾，再次点击从头播放，上传预览与转换结果同样生效；② 涂抹去水印笔迹改为平滑连续实心线条（之前是点点点断开的），所见即所得，实际去除区域与涂抹区域完全一致；③ 任务页图片任务（格式转换/去水印）完成后直接显示结果预览图，先看效果再决定是否下载；④ 文件识别增强：APK 不再误报为 ZIP——通过头部与末尾中央目录特征准确区分 APK/JAR/EPUB/DOCX/XLSX/PPTX 与普通 ZIP，真实是 ZIP 就显示 ZIP、真实是 APK 就显示 APK；同时修复 Uri 文件尾部特征读取错误（旧版 skip 计数 bug 导致结尾校验失效）。作者：罗根"
          gh release upload v1.3.3 MediaForge-v1.3.3.apk --clobber
