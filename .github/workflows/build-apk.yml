name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare LaMa inpainting model (download + int8 quantize + verify)
        run: |
          pip install --quiet onnxruntime onnx
          python scripts/prepare_model.py

      - name: Build APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Sign APK
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          echo "Using build-tools: $BT"
          keytool -genkeypair -v -keystore release.keystore -alias mediaforge \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass mediaforge2024 -keypass mediaforge2024 \
            -dname "CN=MediaForge, OU=Logan, O=Logan, C=CN"
          ${BT}/zipalign -f 4 app/build/outputs/apk/release/app-release-unsigned.apk app-release-aligned.apk
          ${BT}/apksigner sign --ks release.keystore --ks-pass pass:mediaforge2024 \
            --key-pass pass:mediaforge2024 --out MediaForge-v1.3.1.apk app-release-aligned.apk
          ${BT}/apksigner verify MediaForge-v1.3.1.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MediaForge-APK
          path: MediaForge-v1.3.1.apk

      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view v1.3.1 || gh release create v1.3.1 --title "MediaForge v1.3.1" --notes "v1.3.1 去水印交互重做（用户反馈修复）：① 框选改为只保留一个框——拖空白处画新框（替换旧框）、拖框内移动位置、拖四角白色圆点缩放大小，不再出现多点多框；② 涂抹高亮改为白色半透明遮罩效果，更像真实涂抹去水印；③ 修复「开始去水印」按钮被顶出屏幕看不到的问题——页面支持上下滚动，按钮提到编辑器正下方并改为两步式大按钮（第一步选图片 / 第二步开始去水印），未标记区域时给出提示；④ 新增「清除框选 / 撤销一笔涂抹 / 清空全部」三个快捷操作。LaMa AI 模型与内置算法兜底保持不变。作者：罗根"
          gh release upload v1.3.1 MediaForge-v1.3.1.apk --clobber
