name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare LaMa inpainting model (download + int8 quantize + verify)
        run: |
          pip install --quiet onnxruntime onnx
          python scripts/prepare_model.py

      - name: Build APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Sign APK
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          echo "Using build-tools: $BT"
          keytool -genkeypair -v -keystore release.keystore -alias mediaforge \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass mediaforge2024 -keypass mediaforge2024 \
            -dname "CN=MediaForge, OU=Logan, O=Logan, C=CN"
          ${BT}/zipalign -f 4 app/build/outputs/apk/release/app-release-unsigned.apk app-release-aligned.apk
          ${BT}/apksigner sign --ks release.keystore --ks-pass pass:mediaforge2024 \
            --key-pass pass:mediaforge2024 --out MediaForge-v1.3.0.apk app-release-aligned.apk
          ${BT}/apksigner verify MediaForge-v1.3.0.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MediaForge-APK
          path: MediaForge-v1.3.0.apk

      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view v1.3.0 || gh release create v1.3.0 --title "MediaForge v1.3.0" --notes "v1.3.0 全新功能：图片去水印（完全离线，不依赖服务器）——新增「去水印」页，支持两种标记方式：① 框选去水印：拖动拉出矩形框住水印；② 涂抹去水印：像画笔一样直接涂抹，笔刷大小可调，支持撤销与清空。内置 LaMa 深度学习修复模型（开源 Apache-2.0，构建时自动 int8 量化打包），根据周围画面智能补全被去除的区域，与整张图自然融合、不突兀；若设备内存不足或模型缺失，自动切换内置多尺度智能填充算法，保证功能永不崩溃。去水印任务与转换任务显示在同一任务列表，真实进度、可下载（无损 PNG）、可重命名。上一版任务排序/时间显示/删除勾选项等优化全部保留。作者：罗根"
          gh release upload v1.3.0 MediaForge-v1.3.0.apk --clobber
